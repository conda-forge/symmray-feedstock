{% set name = "symmray" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/symmray-{{ version }}.tar.gz
  sha256: 5952a85899e102e61825f1a23f1fa675d6fba66d5f78ba47c12db372ae67b1c5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - autoray
    - cotengra

test:
  imports:
    - symmray
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/jcmgray/symmray
  dev_url: https://github.com/jcmgray/symmray
  doc_url: https://symmray.readthedocs.io/
  summary: A minimal block sparse symmetric and fermionic tensor python library
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jcmgray
